<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Bussipukki LauluStudio</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; text-align: center; padding: 20px; }
        #canvas { background: white; border: 2px solid #333; width: 100%; max-width: 600px; height: 200px; display: block; margin: 10px auto; }
        .stats { font-size: 1.5rem; margin: 10px; color: #2c3e50; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #e67e22; color: white; border: none; border-radius: 50px; }
        #palaute { font-size: 2rem; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🎤 Bussipukki LauluStudio</h1>
    <div class="stats">Pisteet: <span id="score">0</span> | Taso: <span id="level">1</span></div>
    
    <canvas id="canvas"></canvas>
    <div id="palaute">--</div>
    <p>Tavoite: C4 (261Hz). Pidä viiva vakaana!</p>
    
    <button onclick="startApp()">Aloita treeni</button>

    <script>
        let audioCtx, analyser, dataArray;
        let score = 0;
        const targetHz = 261.63;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let x = 0;

        async function startApp() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioCtx.createMediaStreamSource(stream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            draw();
        }

        function draw() {
            requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);
            
            let max = 0, index = 0;
            for(let i=0; i<dataArray.length; i++) {
                if(dataArray[i] > max) { max = dataArray[i]; index = i; }
            }
            
            const hz = Math.round(index * audioCtx.sampleRate / analyser.fftSize);
            
            // Päivitä piirto
            ctx.fillStyle = "white"; ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.strokeStyle = "orange"; ctx.beginPath();
            ctx.moveTo(x, 100); ctx.lineTo(x, 100 - (hz/5)); ctx.stroke();
            x = (x + 2) % canvas.width;
            if(x === 0) ctx.clearRect(0,0,canvas.width, canvas.height);

            // Palaute
            if(max > 30) {
                if(Math.abs(hz - targetHz) < 10) {
                    document.getElementById('palaute').innerText = "Loistavaa! 🎯";
                    score += 1;
                } else if(hz < targetHz) {
                    document.getElementById('palaute').innerText = "Nosta korkeutta ↑";
                } else {
                    document.getElementById('palaute').innerText = "Laske korkeutta ↓";
                }
                document.getElementById('score').innerText = score;
            }
        }
    </script>
</body>
</html>
