<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Bussipukki LauluStudio Pro</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        #canvas { background: #222; border: 4px solid #555; width: 95%; height: 400px; margin: 20px auto; display: block; border-radius: 10px; }
        .info { font-size: 2rem; margin: 20px; font-weight: bold; }
        /* Kasvatetut napit */
        button { 
            padding: 30px 60px; 
            font-size: 2rem; 
            margin: 15px; 
            cursor: pointer; 
            border-radius: 20px; 
            border: none; 
            background: #2980b9; 
            color: white; 
            font-weight: bold;
        }
        button:active { background: #3498db; }
    </style>
</head>
<body>
    <h1>🎤 Bussipukki LauluStudio Pro</h1>
    <div class="info" id="status">Paina aloittaaksesi äänialan tutkimus</div>
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <button onclick="startApp()">Aloita mittaus</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let audioCtx, analyser;

        async function startApp() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                analyser = audioCtx.createAnalyser();
                audioCtx.createMediaStreamSource(stream).connect(analyser);
            }
            draw();
        }

        function draw() {
            requestAnimationFrame(draw);
            let data = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(data);
            
            let max = 0, index = 0;
            for(let i=0; i<data.length; i++) { if(data[i] > max) { max = data[i]; index = i; } }
            const hz = index * audioCtx.sampleRate / analyser.fftSize;

            ctx.fillStyle = "#222"; ctx.fillRect(0,0,canvas.width, canvas.height);
            
            // Viivasto
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 2;
            for(let i=0; i<8; i++) {
                let y = 50 * i + 20;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                ctx.fillStyle = "#888";
                ctx.font = "20px Arial";
                ctx.fillText(["C5","B4","A4","G4","F4","E4","D4","C4"][i], 15, y - 5);
            }

            // Pystysuora viiva äänen korkeudelle
            if(max > 30 && hz > 100 && hz < 1000) {
                let y = 400 - ((hz - 200) / 1.5); 
                ctx.strokeStyle = "#00ff00"; 
                ctx.lineWidth = 10;
                ctx.beginPath(); ctx.moveTo(canvas.width / 2, 400); ctx.lineTo(canvas.width / 2, y); ctx.stroke();
                document.getElementById('status').innerText = "Taajuus: " + Math.round(hz) + " Hz";
            }
        }
    </script>
</body>
</html>
