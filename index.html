<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Bussipukki LauluStudio Pro</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; text-align: center; padding: 10px; transition: background 0.5s; }
        #canvas { background: white; border: 4px solid #333; width: 95%; height: 250px; margin: 10px auto; display: block; }
        .stats { font-size: 1.3rem; margin: 10px; font-weight: bold; }
        button { padding: 15px; margin: 5px; cursor: pointer; border-radius: 8px; border: none; background: #2980b9; color: white; }
        .tauko { background: #e74c3c; }
    </style>
</head>
<body>
    <h1>🎤 Bussipukki LauluStudio Pro</h1>
    <div class="stats" id="info">Valitse harjoitus ja paina "Aloita kuuntelu"</div>
    <canvas id="canvas"></canvas>
    <div id="kehitysgraafi">Kehityshistoria: Ei vielä tuloksia.</div>
    
    <div class="controls">
        <button onclick="aloitaHarjoitus('Do-Re-Mi')">Do-Re-Mi</button>
        <button onclick="aloitaHarjoitus('Sireeni')">Sireeni</button>
        <button onclick="startApp()">Aloita kuuntelu</button>
        <button class="tauko" onclick="pidaTauko()">Tauko (Pala kurkussa)</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let audioCtx, analyser, stats = JSON.parse(localStorage.getItem('lauluStats')) || [];
        let startTime = Date.now();

        function pidaTauko() {
            document.body.style.backgroundColor = "#ff9999";
            document.getElementById('info').innerText = "Ääni tarvitsee lepoa! Pysähdy heti.";
        }

        function aloitaHarjoitus(tyyppi) {
            document.body.style.backgroundColor = "#f0f4f8";
            document.getElementById('info').innerText = "Harjoitus: " + tyyppi + ". Laula nuottiviivaston mukaan.";
            // Tässä voisi olla logiikka tehtävän automaattiseen vaihtoon
        }

        async function startApp() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioCtx.createMediaStreamSource(stream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            source.connect(analyser);
            draw();
        }

        function draw() {
            requestAnimationFrame(draw);
            let dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            let max = 0, index = 0;
            for(let i=0; i<dataArray.length; i++) { if(dataArray[i] > max) { max = dataArray[i]; index = i; } }
            const hz = Math.round(index * audioCtx.sampleRate / analyser.fftSize);

            // Piirretään nuottiviivasto
            ctx.fillStyle = "white"; ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.strokeStyle = "#ccc";
            for(let i=0; i<5; i++) {
                ctx.beginPath(); ctx.moveTo(0, 80 + (i * 30)); ctx.lineTo(canvas.width, 80 + (i * 30)); ctx.stroke();
            }

            // Piirretään laulajan viiva
            if(max > 30) {
                ctx.strokeStyle = "#e67e22"; ctx.lineWidth = 5;
                ctx.lineTo(200, 200 - (hz/3)); ctx.stroke();
            }

            // Treeniaika-tarkistus (15 min)
            if (Date.now() - startTime > 15 * 60 * 1000) {
                document.getElementById('info').innerText = "15 min täynnä – pidä tauko!";
            }
        }
    </script>
</body>
</html>
