<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Lauluharjoitus</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #mittari { font-size: 3rem; margin: 20px; padding: 20px; border: 2px solid #ccc; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Lauluharjoittelu</h1>
    <button onclick="soitaSavel()">Soita mallisävel (C4)</button>
    <button onclick="aloitaKuuntelu()">Aloita mikrofonin kuuntelu</button>
    
    <div id="mittari">-- Hz</div>
    <p>Laula mikrofoniin nähdäksesi taajuuden.</p>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // 1. Soittaa malliäänen
        function soitaSavel() {
            const osc = audioCtx.createOscillator();
            osc.frequency.setValueAtTime(261.63, audioCtx.currentTime);
            osc.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        // 2. Kuuntelee mikrofonia (yksinkertainen visualisointi)
        async function aloitaKuuntelu() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function paivita() {
                analyser.getByteFrequencyData(dataArray);
                // Etsitään voimakkain taajuus
                let max = 0;
                let index = 0;
                for(let i=0; i<bufferLength; i++) {
                    if(dataArray[i] > max) { max = dataArray[i]; index = i; }
                }
                const hz = Math.round(index * audioCtx.sampleRate / analyser.fftSize);
                if (max > 50) { // vain jos laulu on tarpeeksi voimakasta
                    document.getElementById('mittari').innerText = hz + " Hz";
                }
                requestAnimationFrame(paivita);
            }
            paivita();
        }
    </script>
</body>
</html>
